# =============================================================================
# deploy/nginx/app.conf : le reverse proxy, SEUL point d'entrée public.
#
#   navigateur ──https 443──▶ proxy (Nginx) ──http──▶ app:3000 ──▶ db
#              ──http 80────▶ proxy : 301 vers https (sauf défi Let's Encrypt)
#
# Monté par compose.prod.yaml sur /etc/nginx/conf.d/default.conf ; le dossier
# deploy/nginx/ entier est aussi monté sur /etc/nginx/snippets/ (voir l'include
# des en-têtes de sécurité plus bas).
#
# À adapter : server_name (votre domaine), le port de l'application dans
# proxy_pass (Node/Next.js 3000, Java/Rust 8080, Phoenix 4000).
#
# Après modification, TOUJOURS tester avant de recharger (sans coupure) :
#   docker compose -f compose.prod.yaml exec proxy nginx -t
#   docker compose -f compose.prod.yaml exec proxy nginx -s reload
# =============================================================================

# ---------- Port 80 : HTTP, uniquement pour rediriger vers HTTPS -------------
server {
    listen 80;
    server_name app.example.com app.localhost localhost;

    # Défi HTTP-01 de Let's Encrypt (cible VPS) : certbot dépose un fichier dans
    # $DEPLOY_DIR/certbot/, que Let's Encrypt vient lire ici. Sans objet en local.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Santé du proxy pour le healthcheck Docker, réservée à l'intérieur du conteneur.
    location = /nginx-health {
        allow 127.0.0.1;
        deny all;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 301 = redirection permanente vers la même URL en HTTPS. Limite : si HTTPS est
    # publié sur un port non standard (HTTPS_PORT=8443), la redirection vise quand
    # même 443 ; ouvrez alors directement https://<hôte>:8443.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- Port 443 : HTTPS, le vrai site --------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name app.example.com app.localhost localhost;

    # Certificat et clé (montés depuis $DEPLOY_DIR/certs, jamais versionnés) :
    # auto-signés par deploy/gen-cert.sh, ou copiés par certbot (mêmes noms).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # TLS 1.0 et 1.1 sont obsolètes (RFC 8996) : refusés.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 1d;

    # HSTS : le navigateur n'essaiera plus jamais HTTP pour ce nom pendant un an.
    # Ne l'activer qu'une fois HTTPS validé (difficile à défaire côté navigateurs).
    # Pas de includeSubDomains tant que TOUS les sous-domaines ne sont pas en HTTPS.
    # « always » : l'en-tête part aussi sur les réponses d'erreur.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # En-têtes de sécurité OPTIONNELS fournis par le bloc devsecops
    # (deploy/nginx/security-headers.conf, des directives add_header).
    # Le motif « * » rend l'include facultatif : sans fichier correspondant,
    # Nginx n'inclut rien et démarre normalement ; un chemin sans motif ferait
    # échouer `nginx -t`. Le fichier ne doit pas redéfinir Strict-Transport-Security.
    # Attention : un add_header écrit DANS une location annule ceux du server
    # pour cette location ; les garder tous à ce niveau.
    include /etc/nginx/snippets/security-headers*.conf;

    # /metrics (Prometheus) ne sort JAMAIS par le proxy public : Prometheus le lit
    # sur le réseau interne (app:3000/metrics). 404 plutôt que 403 : on ne
    # confirme même pas qu'il existe. ^~ couvre aussi /metrics/… et /metrics?…
    # (Java/Spring : bloquer aussi /actuator, voir references/stacks.md.)
    location ^~ /metrics {
        return 404;
    }

    location / {
        # `app` = nom du service dans compose.prod.yaml, résolu par le DNS de
        # Docker AU DÉMARRAGE de Nginx (ou au rechargement) : deploy.sh fait donc
        # `nginx -s reload` après chaque déploiement de l'application.
        proxy_pass http://app:3000;

        # Ce que l'application doit savoir du client réel (sinon elle ne voit que
        # l'IP du proxy et croit être en HTTP : redirections et cookies Secure faux).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
