# =============================================================================
# deploy/nginx/security-headers.conf : en-têtes de sécurité HTTP du proxy
#
# Inclus par deploy/nginx/app.conf (bloc cd-release), dans le `server` HTTPS :
#     include /etc/nginx/snippets/security-headers*.conf;
# compose.prod.yaml monte deploy/nginx/ sur /etc/nginx/snippets/ : poser ce
# fichier dans deploy/nginx/ suffit, app.conf n'a pas à changer.
#
# Strict-Transport-Security n'est PAS ici : app.conf le pose déjà (un en-tête
# en double serait envoyé deux fois, et les navigateurs n'en lisent qu'un).
#
# PIÈGE NGINX : `add_header` n'est hérité QUE si le niveau courant n'en a aucun.
# Une `location` qui pose son propre add_header (Cache-Control…) PERD tous ceux
# du `server`, CSP et HSTS compris. Dans ce cas, ré-inclure ce fichier DANS la
# location ET y reposer HSTS :
#     location /_next/static/ {
#         include /etc/nginx/snippets/security-headers.conf;
#         add_header Strict-Transport-Security "max-age=31536000" always;
#         add_header Cache-Control "public, max-age=31536000, immutable" always;
#         proxy_pass http://app:3000;
#     }
# Vérifier toujours sur plusieurs chemins : curl -skI https://<hôte>/ et /<un-asset>.
#
# `always` : l'en-tête part aussi sur les erreurs (404, 500, 502), pas seulement sur 2xx/3xx.
# Ce fichier ne contient QUE des directives valides dans server ET location.
# Après modification : nginx -t, puis nginx -s reload (commandes dans app.conf).
# =============================================================================

# Ne pas annoncer la version de nginx (en-tête Server, pages d'erreur).
server_tokens off;

# Retire « X-Powered-By: Express » (ou Next.js, PHP…) des réponses de l'application.
proxy_hide_header X-Powered-By;

# --- Content-Security-Policy : quelles ressources le navigateur peut charger ---
# Point de départ pour un front servi par l'application (SPA Vite, pages serveur)
# sans script ni style inline. À RÉGLER pour chaque projet (references/<stack>.md) :
#   - API JSON seule : "default-src 'none'; frame-ancestors 'none'" (rien à charger) ;
#   - Next.js : scripts inline d'hydratation => 'unsafe-inline' ou nonces (references/node.md) ;
#   - appels à un service tiers (Convex, Stripe…) : l'ajouter à connect-src / script-src.
# Méthode sans rien casser : poser d'abord la même valeur dans
# Content-Security-Policy-Report-Only, naviguer (console F12 : violations listées),
# ajuster la directive concernée, puis basculer en Content-Security-Policy.
# frame-ancestors 'none' : personne ne peut afficher le site dans une iframe (clickjacking).
# upgrade-insecure-requests : une ressource http:// oubliée est demandée en https://.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# Anti-clickjacking pour les navigateurs qui ignorent frame-ancestors.
add_header X-Frame-Options "DENY" always;

# Le navigateur ne « devine » pas le type d'un fichier (pas de JS déguisé en image).
add_header X-Content-Type-Options "nosniff" always;

# Les sites tiers ne reçoivent que l'origine, jamais l'URL complète (jetons, identifiants).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Coupe les API du navigateur que l'application n'utilise pas. En ajouter une
# seulement si une fonctionnalité en a besoin (ex. geolocation=(self)).
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Isolation d'origine : une fenêtre ouverte par un autre site ne garde pas de
# référence vers la nôtre ; nos ressources ne s'intègrent pas ailleurs.
# (Cross-Origin-Embedder-Policy: require-corp n'est PAS posé : il casse les
# images et scripts tiers sans en-tête CORP ; à n'ajouter qu'en connaissance de cause.)
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# X-XSS-Protection n'est volontairement pas posé : obsolète, ignoré par les
# navigateurs récents ; c'est la CSP qui protège des XSS.
