# =============================================================================
# ci.yml : intégration continue (Java / Gradle)
#
# Checks requis du ruleset (noms STABLES) :
#   lint          spotlessCheck / checkstyleMain                       requis
#   test          tests unitaires + jacocoTestCoverageVerification     requis
#   integration   suite integrationTest contre PostgreSQL              requis si base
#   build         assemble                                             requis
#   docker-build  l'image Docker se construit                          non requis
# Toujours ./gradlew : la version de Gradle est figée dans gradle/wrapper/.
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: "21" # = la toolchain Java déclarée dans build.gradle(.kts)

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Cache Gradle (dépendances, wrapper, cache de build) + vérifie le wrapper :
      # un gradle-wrapper.jar modifié par une PR malveillante serait refusé.
      - uses: gradle/actions/setup-gradle@v6
      - name: Formatage et analyse statique
        run: ./gradlew spotlessCheck checkstyleMain # adapter aux plugins présents

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      # jacocoTestCoverageVerification échoue sous le seuil défini dans build.gradle
      - name: Tests unitaires + couverture (JaCoCo)
        run: ./gradlew test jacocoTestCoverageVerification

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # À supprimer si pas de base ; avec Testcontainers, garder le job sans services/env.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app # base jetable : pas un secret
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/app
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      # Suite déclarée avec le plugin jvm-test-suite (voir references/java.md)
      - name: Tests d'intégration (PostgreSQL)
        run: ./gradlew integrationTest

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble (sans les tests, qui ont leurs jobs)
        run: ./gradlew assemble

  # À supprimer s'il n'y a pas de Dockerfile.
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
