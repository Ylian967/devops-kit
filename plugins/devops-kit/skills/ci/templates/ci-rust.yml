# =============================================================================
# ci.yml : intégration continue (Rust / cargo)
#
# Checks requis du ruleset (noms STABLES) :
#   lint          cargo fmt --check + cargo clippy (avertissements = erreurs)   requis
#   test          cargo llvm-cov (tests unitaires + seuil de couverture)        requis
#   integration   tests ignorés par défaut, lancés contre PostgreSQL            requis si base
#   build         cargo build --release                                         requis
#   docker-build  l'image Docker se construit                                   non requis
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always # logs colorés et lisibles dans l'interface GitHub
  COVERAGE_MIN: 80 # seuil de couverture des lignes (cargo n'a pas de fichier de config pour ça)

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installe la toolchain stable (ou celle de rust-toolchain.toml s'il existe : rustup le lit tout seul)
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Cache ~/.cargo et target/ (clé = Cargo.lock + toolchain)
      - uses: Swatinem/rust-cache@v2
      - name: Formatage (rustfmt)
        run: cargo fmt --all --check
      # --locked : échoue si Cargo.lock n'est pas à jour ; -D warnings : un avertissement fait échouer
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview # requis par cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Binaire précompilé de cargo-llvm-cov (bien plus rapide qu'un cargo install)
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Lance cargo test en mesurant la couverture ; échoue sous le seuil.
      # Les tests marqués #[ignore] (intégration) ne tournent pas ici.
      - name: Tests unitaires + couverture
        run: cargo llvm-cov --all-features --locked --fail-under-lines "$COVERAGE_MIN"

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # À supprimer si le projet n'a pas de base.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app # base jetable : pas un secret
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Convention (voir references/rust.md) : les tests qui ont besoin d'une base
      # sont marqués #[ignore = "base requise"] ; --ignored ne lance QU'EUX.
      - name: Tests d'intégration (PostgreSQL)
        run: cargo test --all-features --locked -- --ignored

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --locked

  # À supprimer s'il n'y a pas de Dockerfile.
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
